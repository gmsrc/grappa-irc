  # ── shottino calls ───────────────────────────────────────────────────
  #
  # The room page and the media endpoints share a prefix on purpose, so
  # shottino needs ONE setting: the page is <base>/ and a participant's
  # endpoints are <base>/rtc/<room>/<nick>/{whip,whep}.
  #
  # HTTPS is not optional here. Browsers refuse getUserMedia outside a
  # secure context, and a page served over TLS cannot fetch() the plain
  # http://…:8889 MediaMTX listens on — mixed content is blocked. So the
  # proxy is what makes browser participation possible at all.
  #
  # NOTE what is NOT proxied: MediaMTX's API. It is off in mediamtx.yml,
  # and it must stay off or be kept off this vhost — /v3/paths/list
  # returns every active path, i.e. every room NAME, and a room name is
  # the credential. The page learns who is in the room from the URL
  # fragment instead, which browsers never send to a server.
  location /call/rtc/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An SDP offer/answer is small; the default buffering is fine, but
    # the exchange is latency-sensitive enough to not want a delay.
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location /call/ {
    alias /var/www/call/;
    index index.html;
    default_type text/html;
  }

