# grappa — nginx config for the FreeBSD bastille jail (dumb proxy → BEAM).
#
# #485 collapsed this to a PURE reverse proxy. The BEAM self-serves the SPA
# + static assets + PWA manifest (Plug.Static + SPA history-fallback) and
# OWNS every security header (GrappaWeb.Plugs.SecurityHeaders), so this jail
# nginx no longer serves files from disk and no longer emits headers — it
# just forwards to the same-jail BEAM on 127.0.0.1:4000. Emitting the
# security headers here too would DUPLICATE the CSP, which browsers enforce
# as the intersection of all policies (a prod-only footgun).
#
# Host-side nginx on m42 reverse-proxies irc.sindro.me + irc.sniffo.org to
# this jail's :80. TLS terminates at the host nginx; this jail listens
# HTTP only. The jail's address is NOT written here — see the listen
# directives below.
#
# Installed by jail_install_nginx.sh which:
#   1. cp this file → /usr/local/etc/nginx/nginx.conf
#   2. cp ../snippets/locations-api.conf → /usr/local/etc/nginx/snippets/
#   3. sysrc nginx_enable=YES && service nginx start/reload

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    upstream grappa_upstream {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    # Listen on every address the jail holds — deliberately NOT a literal.
    #
    # A jail renumbers (this one moved to VNET and changed address), and a
    # hardcoded `listen <addr>:80` breaks SILENTLY when it does: the config
    # on disk stops being loadable, but the already-running nginx keeps
    # serving the config it parsed at start, so the site looks healthy right
    # up until the next reload or jail restart. That is the #599 ruling
    # against address literals, and it is the exact failure this line fixes
    # — the deploy that installed the stale literal failed `nginx -t` with
    # `bind() to <addr>:80 failed (49: Can't assign requested address)` and
    # left prod one restart away from down.
    #
    # Binding wildcard does not widen the security boundary in any way that
    # matters: the boundary is the jail itself (pf + bastille), not the
    # choice of bind address. Anyone who can reach one of this jail's
    # addresses on :80 could already reach it. The authority on where the
    # traffic actually arrives is the host's upstream block
    # (/usr/local/etc/nginx/sites/irc.openssl.it), not this file.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Dumb reverse proxy — no `root`, no static serving. The BEAM
        # self-serves the SPA + owns all headers. Shared with every other
        # nginx substrate (single source of truth).
        include snippets/locations-api.conf;
    }
}
