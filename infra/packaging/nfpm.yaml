# nfpm config — builds the grappa .deb AND .rpm from the staging tree
# assembled by build.sh. nfpm is a single Go binary (no dpkg/rpmbuild
# toolchain, no host hex) that renders the SAME staging tree into either
# format; build.sh picks the format via GRAPPA_PKG_FORMAT and nfpm's `-p`.
#
# The FORMAT is just a flag — the PAYLOAD is not. The release bundles ERTS
# + crypto NIFs linked against the BUILD host's glibc/libssl, so a
# Debian-built payload is a valid .deb but not a valid .rpm. That is why
# the .rpm builds in a Fedora container (release.yml `rpm` job) with its own
# Fedora ERTS, not on the Debian runner that builds the .deb (#438). See
# build.sh + the packaging README.
#
# Per-format package DEPENDENCIES live under `overrides.{deb,rpm}` below —
# ONE config, no duplicate file: the Debian and RPM runtime-lib package
# names are disjoint (libssl3 vs openssl-libs, …), and nfpm's `overrides`
# exists for exactly this. Everything else (contents, scripts, metadata) is
# shared, because the FHS layout and the maintainer scripts are — the
# scripts are written to handle both dpkg (string $1) and rpm (numeric $1)
# argument conventions (see scripts/*.sh).
#
# ${GRAPPA_VERSION} / ${GRAPPA_PKG_ARCH} are expanded from the environment
# build.sh exports.

name: grappa
arch: ${GRAPPA_PKG_ARCH}
platform: linux
version: ${GRAPPA_VERSION}
section: net
priority: optional
maintainer: "Marcello Barnaba <vjt@users.noreply.github.com>"
vendor: "Marcello Barnaba"
homepage: "https://github.com/vjt/grappa-irc"
license: "MIT"
description: |
  Always-on IRC bouncer with a REST + Phoenix Channels API, a bundled
  irssi-shaped web PWA (cicchetto), and a terminal client (shottino).
  One supervised OTP process per (user, network); sqlite-backed
  scrollback. Ships a self-contained Erlang/OTP release and self-serves
  the web frontend, so nginx is recommended for TLS but not required.
  The terminal client installs as /usr/bin/shottino and talks to the
  same REST + Channels API as the web frontend.

# Runtime deps are per-format (disjoint package names across distro
# families), so they live under `overrides` — NOT top-level `depends`,
# which nfpm would apply to BOTH formats. The bundled ERTS links these
# system libs; shottino links the same libssl + the WIDE ncurses.
#
# recommends: the media-metadata strip (#39) shells out to exiftool/ffmpeg
# fail-closed (without them uploads 422), and nginx is the recommended
# TLS/static front. All soft — the bouncer boots and serves without any of
# them, and a Recommends whose package is absent from the enabled repos is
# silently ignored (matters for ffmpeg on Fedora: it lives in RPM Fusion,
# not base, so it stays a best-effort weak dep).
overrides:
  deb:
    depends:
      # libncursesw6 is for SHOTTINO and is NOT the same Debian package as
      # libncurses6: the client links libncursesw.so.6 (the WIDE build,
      # because it is UTF-8 end to end) while ERTS wants the narrow
      # libncurses6. Debian ships them separately, so depending on only one
      # leaves the other's consumer with "cannot open shared object file"
      # at exec time. (Fedora folds both SONAMEs into one ncurses-libs — see
      # the rpm override.)
      #
      # libssl3t64 | libssl3: Debian's 64-bit time_t transition renamed the
      # OpenSSL runtime package `libssl3` -> `libssl3t64` on Ubuntu 24.04
      # (noble) and forward, WITHOUT a `Provides: libssl3` — the pre-t64
      # names are being decrufted, so a hard-coded `libssl3` is
      # UNINSTALLABLE there. The release job builds AND `apt install`s the
      # .deb on ubuntu-latest (noble). The alternation resolves libssl3t64
      # on noble/trixie, falls back to libssl3 on bookworm/pre-t64. Same
      # libssl.so.3 SONAME either way.
      - libssl3t64 | libssl3
      - libncurses6
      - libncursesw6
      - libstdc++6
      - libgcc-s1
      - ca-certificates
      - passwd # provides useradd/groupadd (preinstall.sh)
    recommends:
      - libimage-exiftool-perl
      - ffmpeg
      - nginx
  rpm:
    depends:
      # Fedora/RHEL package names for the SAME SONAMEs the deb depends on.
      # openssl-libs = libssl.so.3 + libcrypto.so.3; ncurses-libs is ONE
      # package providing BOTH libncurses.so.6 (ERTS) and libncursesw.so.6
      # (shottino) — no wide/narrow split like Debian, so a single entry
      # covers both consumers. shadow-utils provides useradd/groupadd (the
      # deb's `passwd`); ca-certificates is the system CA trust store that
      # #89's verify_peer / :public_key.cacerts_get/0 reads.
      - openssl-libs
      - ncurses-libs
      - libstdc++
      - libgcc
      - ca-certificates
      - shadow-utils
    recommends:
      - perl-Image-ExifTool
      - ffmpeg
      - nginx

contents:
  # The mix release (self-contained ERTS + compiled app + boot scripts).
  - src: ./staging/usr/lib/grappa
    dst: /usr/lib/grappa

  # shottino — the terminal client (frontends/shottino), compiled by
  # build.sh into the staging tree.
  #
  # Ships in the SAME package as the bouncer rather than a separate
  # grappa-shottino: it is one ~180 KB binary whose runtime deps (libssl3,
  # libncurses6) are ALREADY in `depends` above for the bundled ERTS, so
  # splitting it would add a package to maintain and buy nothing. It is a
  # client for THIS server; installing grappa and getting a way to talk to
  # it is the expected shape.
  - src: ./staging/usr/bin/shottino
    dst: /usr/bin/shottino
    file_info:
      mode: 0755

  # The built cicchetto SPA dist (CIC_DIST_ROOT points here). Read-only
  # static assets served by Plug.Static.
  - src: ./staging/usr/share/grappa/cicchetto-dist
    dst: /usr/share/grappa/cicchetto-dist

  # systemd vendor unit.
  - src: ./grappa.service
    dst: /usr/lib/systemd/system/grappa.service

  # Env template (postinstall copies to /etc/grappa/grappa.env on first
  # install) + the openssl secret generator.
  - src: ./grappa.env.example
    dst: /usr/share/grappa/grappa.env.example
  - src: ./gen-secrets.sh
    dst: /usr/share/grappa/gen-secrets.sh
    file_info:
      mode: 0755

  # Operator CLI: `grappa migrate`, `grappa remote`, `grappa gen-secrets`.
  - src: ./grappa-wrapper.sh
    dst: /usr/bin/grappa
    file_info:
      mode: 0755

  # README shipped to the doc dir (postinstall points the operator here).
  - src: ./README.md
    dst: /usr/share/doc/grappa/README.md

  # State + config dirs (owned so the daemon can write; env dir root:grappa).
  - dst: /var/lib/grappa
    type: dir
    file_info:
      mode: 0750
      owner: grappa
      group: grappa
  - dst: /etc/grappa
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: grappa

# NB: /etc/grappa/grappa.env is intentionally NOT a packaged file (and
# not a conffile). postinstall creates it from the template with generated
# secrets, so an upgrade never clobbers an operator's live secrets.

scripts:
  preinstall: ./scripts/preinstall.sh
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh
